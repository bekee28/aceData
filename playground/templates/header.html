    {% load static %}
    <!-- ========== HEADER ========== -->
    <header id="header" class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom">
        <div class="container">
          <!-- Default Logo -->
          <a class="navbar-brand" href="{% url 'home' %}" aria-label="ACE">
            <img style="width:auto;height:2.25rem" src="{% static 'playground/assets/svg/logos/logo-icon.svg' %}" alt="ACE">
          </a>
          <!-- End Default Logo -->

          <!-- Toggler -->
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-default">
              <i class="bi-list"></i>
            </span>
            <span class="navbar-toggler-toggled">
              <i class="bi-x"></i>
            </span>
          </button>
          <!-- End Toggler -->

          <!-- Collapse -->
          <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <!-- Center nav links -->
            <ul class="navbar-nav mx-auto">
              <li class="nav-item"><a class="nav-link px-lg-3" href="/services">Services</a></li>
              <li class="nav-item"><a class="nav-link px-lg-3" href="/pricing">Pricing</a></li>
              <li class="nav-item"><a class="nav-link px-lg-3" href="/about">About</a></li>
              <li class="nav-item"><a class="nav-link px-lg-3" href="/contacts">Contact</a></li>
            </ul>
            <!-- End Center nav links -->

            <!-- Right-aligned actions -->
            <div class="d-flex align-items-center mt-3 mt-lg-0">
              {% if user.is_authenticated %}
              <a class="nav-link px-2" href="{% url 'account' %}"><i class="bi-person-circle me-1"></i>{{ user.username }}</a>
              <form method="post" action="{% url 'logout' %}" class="d-inline ms-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-soft-primary btn-sm">Log out</button>
              </form>
              {% else %}
              <a class="nav-link px-2" href="/login">Log in</a>
              <a class="btn btn-primary btn-sm ms-2" href="/signup"><i class="bi-person-circle me-1"></i> Sign up</a>
              {% endif %}
            </div>
            <!-- End Right-aligned actions -->
          </div>
          <!-- End Collapse -->
        </div>
      </header>

      <!-- ========== END HEADER ========== -->
