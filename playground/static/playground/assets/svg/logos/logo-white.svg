<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 62 432 232" width="432" height="232" role="img" aria-label="ACE">
  <!-- "A" (no crossbar) -->
  <path d="M72 270 L140 82 L208 270" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- crossbar = upward trendline (growth) -->
  <polyline points="98,198 130,158 154,184 186.05,145.97" fill="none" stroke="#2CD9A8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="208,120 203.62,160.82 168.48,131.12" fill="#2CD9A8"/>
  <!-- wordmark: the A above + CE = ACE -->
  <text x="250" y="270" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="700" font-size="196" fill="#FFFFFF">CE</text>
</svg>
