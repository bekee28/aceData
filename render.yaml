# Render Blueprint for the ACE site (acedataworks.com).
# Apply via Render Dashboard -> "New +" -> "Blueprint" and point it at this repo.
# Secret values (Stripe, email password, DATABASE_URL) use `sync: false` so Render
# prompts you in the dashboard — they are never stored in this file / git.
#
# The database is an external free Neon Postgres (not a Render-managed DB): create
# a Neon project, then paste its connection string as DATABASE_URL when prompted.
#
# NOTE: Render plan names and Python versions drift over time — verify the
# current values against Render's docs before applying.

services:
  - type: web
    name: acedata
    runtime: python
    plan: starter                # "free" sleeps + cold-starts (bad for the Stripe webhook)
    region: oregon               # pick the region closest to your users
    branch: aceDataMain          # deploy branch (merge the cleanup PR into this first)
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    preDeployCommand: "python manage.py migrate"
    startCommand: "gunicorn project.wsgi:application"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL         # paste the Neon connection string (postgres://...) in the dashboard
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true       # Render generates a strong key
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DJANGO_ALLOWED_HOSTS
        value: "acedataworks.com,www.acedataworks.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://acedataworks.com,https://www.acedataworks.com"
      - key: BASE_URL
        value: "acedataworks.com"

      # --- Email (mailbox: contact@acedataworks.com, hosted at Hostinger) ---
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: DEFAULT_FROM_EMAIL
        value: "contact@acedataworks.com"
      - key: EMAIL_HOST
        value: "smtp.hostinger.com"   # use smtp.titan.email if your plan is Titan-based
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "contact@acedataworks.com"
      - key: EMAIL_HOST_PASSWORD      # mailbox password — secret, entered in dashboard only
        sync: false

      # --- Stripe (use LIVE keys for production) ---
      - key: STRIPE_CURRENCY
        value: "usd"
      - key: TIER_2_AMOUNT_CENTS
        value: "14900"
      - key: TIER_3_AMOUNT_CENTS
        value: "34900"
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
